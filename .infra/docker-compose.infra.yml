services:
  reverse-proxy:
    image: traefik:v3.6.1
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard de Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro,z
      - ./config/config.yml:/etc/traefik/config.yml:ro,z
      - ./certs:/etc/certs:ro,z
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - fast_pdf_network
    depends_on:
      - redis-ratelimiter
      - redis-queue
      - redis-cache

  redis-ratelimiter:
    image: redis:7-alpine
    container_name: redis-ratelimiter
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis-ratelimiter.conf
    volumes:
      - ./config/redis-ratelimiter.conf:/usr/local/etc/redis/redis-ratelimiter.conf:ro
    networks:
      - fast_pdf_network

  redis-queue:
    image: redis:7-alpine
    container_name: redis-queue
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis-queue.conf
    volumes:
      - ./config/redis-queue.conf:/usr/local/etc/redis/redis-queue.conf:ro
      - redis_queue_data:/data
    networks:
      - fast_pdf_network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis-cache.conf
    volumes:
      - ./config/redis-cache.conf:/usr/local/etc/redis/redis-cache.conf:ro
      - redis_cache_data:/data
    networks:
      - fast_pdf_network
  
  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - fast_pdf_network
    volumes:
      - mongo_storage_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh","--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


volumes:
  redis_queue_data:
  redis_cache_data:
  mongo_storage_data:

networks:
  fast_pdf_network:
    name: fast_pdf_network
    driver: bridge
